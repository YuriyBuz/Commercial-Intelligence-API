<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  Скрипти дозволені лише з цього походження, cdnjs та вебдодатку Apps Script
  (він віддає дані через JSONP і редіректить на googleusercontent).
  'unsafe-inline' у style-src потрібен через inline-атрибути style у розмітці;
  прибрати його можна, лише переписавши їх на класи.
  frame-ancestors у <meta> браузери ігнорують — захист від фреймів потребує
  HTTP-заголовка, якого GitHub Pages не дає.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' https://cdnjs.cloudflare.com https://script.google.com https://script.googleusercontent.com;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com;
  img-src 'self' data:;
  connect-src 'self';
  manifest-src 'self';
  worker-src 'self';
  base-uri 'none';
  form-action 'none';
  object-src 'none'">
<meta name="theme-color" content="#12100E">
<title>Foodline · Комерційний пульт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">
<meta name="description" content="Аналітика продажів, юніт-економіки, промо-плану та рентабельності Foodline Production.">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Foodline">
<link rel="manifest" href="manifest.webmanifest">
<!-- У репозиторії лежить лише 512×512; менші розміри браузер масштабує сам -->
<link rel="icon" href="assets/icons/icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/icon-512.png">
<link rel="stylesheet" href="assets/styles.css?v=6">
</head>
<body>

<canvas id="stars" aria-hidden="true" style="position:fixed;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block"></canvas>

<div id="boot" role="status" aria-label="Запуск панелі">
  <div class="ring"><i></i><i></i><i></i><b>FL</b></div>
  <div class="lines">
    <div>канал даних<span>готово</span></div>
    <div>собівартість і умови мереж<span>звірено</span></div>
    <div>промо-календар<span>розібрано</span></div>
    <div>рентабельність по клієнтах<span>зчитано</span></div>
    <div>панель<span>до роботи</span></div>
  </div>
  <div class="bar"><i></i></div>
</div>

<header class="topbar">
  <div class="mark"><i></i><b>FOODLINE</b><span>Комерційний пульт</span></div>
  <div class="spacer"></div>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">не підключено</span></div>
  <button class="btn sm" id="btnInstall" style="display:none" title="Встановити як застосунок">Встановити</button>
  <button class="btn sm" id="btnCalm" title="Вимкнути рух інтерфейсу">Спокій</button>
  <button class="btn sm" id="btnReload" title="Перезавантажити з джерела">Оновити</button>
  <button class="btn sm" id="btnSource">Джерело даних</button>
</header>

<div class="shell">
  <nav class="rail" id="rail"></nav>

  <div class="main">
    <div class="filters" id="filters"></div>
    <div class="wrap" id="view"></div>
  </div>
</div>

<!--
  TODO: додати integrity="sha384-…" (хеш є на сторінці Chart.js у cdnjs, кнопка «Copy SRI»,
  або локально: curl -s https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js |
                openssl dgst -sha384 -binary | openssl base64 -A
  Поки хеша немає, джерело обмежене директивою script-src у CSP вище.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" crossorigin="anonymous"></script>
<script src="assets/app.js?v=6"></script>
</body>
</html>
